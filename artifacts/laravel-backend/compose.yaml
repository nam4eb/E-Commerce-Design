name: dienmay365

x-app-environment: &app-environment
  APP_NAME: Điện Máy 365
  APP_ENV: local
  APP_KEY: ${APP_KEY:-base64:4QsNIvvK2r4O1tjXO39exlqVkb4D5say0fJZM8F30/w=}
  APP_DEBUG: "true"
  APP_URL: http://localhost:8000
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-dienmay365}
  DB_USERNAME: ${DB_USERNAME:-dienmay365}
  DB_PASSWORD: ${DB_PASSWORD:-local-secret}
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  MEDIA_DISK: ${MEDIA_DISK:-public}
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
  MAIL_PORT: ${MAIL_PORT:-2525}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
  INERTIA_SSR_ENABLED: "true"
  INERTIA_SSR_URL: http://ssr:13714
  INERTIA_SSR_THROW_ON_ERROR: "true"
  MANUAL_PAYMENT_WEBHOOK_SECRET: ${MANUAL_PAYMENT_WEBHOOK_SECRET:-}
  PAYMENT_WEBHOOK_TOLERANCE: ${PAYMENT_WEBHOOK_TOLERANCE:-300}
  MANUAL_SHIPPING_WEBHOOK_SECRET: ${MANUAL_SHIPPING_WEBHOOK_SECRET:-}
  SHIPPING_WEBHOOK_TOLERANCE: ${SHIPPING_WEBHOOK_TOLERANCE:-300}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  CSP_REPORT_ONLY: ${CSP_REPORT_ONLY:-false}
  ADMIN_MFA_REQUIRED: ${ADMIN_MFA_REQUIRED:-true}
  WEBHOOK_MAX_BYTES: ${WEBHOOK_MAX_BYTES:-262144}
  QUEUE_WARNING_SIZE: ${QUEUE_WARNING_SIZE:-100}
  FAILED_JOBS_WARNING: ${FAILED_JOBS_WARNING:-1}
  FAILED_WEBHOOKS_WARNING: ${FAILED_WEBHOOKS_WARNING:-1}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/dang-nhap/google/callback}
  FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
  FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
  FACEBOOK_REDIRECT_URI: ${FACEBOOK_REDIRECT_URI:-http://localhost:8000/dang-nhap/facebook/callback}
  CHATBOT_ENABLED: ${CHATBOT_ENABLED:-true}
  CHATBOT_SERVICE_URL: http://chatbot:8001
  CHATBOT_SERVICE_SECRET: ${CHATBOT_SERVICE_SECRET:-local-chatbot-secret}

x-runtime-security: &runtime-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp

services:
  app:
    <<: *runtime-security
    build:
      context: .
      target: app
    environment: *app-environment
    command: sh -lc "cd public && exec php -S 0.0.0.0:8000 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ssr:
        condition: service_started
    healthcheck:
      test: ["CMD", "php", "artisan", "about", "--only=environment"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - media-data:/var/www/html/storage/app/public

  ssr:
    <<: *runtime-security
    build:
      context: .
      target: ssr
    environment:
      NODE_ENV: production
      PORT: 13714
    expose:
      - "13714"

  queue:
    <<: *runtime-security
    build:
      context: .
      target: app
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=90
    environment: *app-environment
    volumes:
      - media-data:/var/www/html/storage/app/public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    <<: *runtime-security
    build:
      context: .
      target: app
    command: php artisan schedule:work
    environment: *app-environment
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  chatbot:
    <<: *runtime-security
    build: ./services/chatbot
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-dienmay365}
      DB_USERNAME: ${CHATBOT_DB_USERNAME:-dienmay365}
      DB_PASSWORD: ${CHATBOT_DB_PASSWORD:-local-secret}
      CHATBOT_SERVICE_SECRET: ${CHATBOT_SERVICE_SECRET:-local-chatbot-secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-dienmay365}
      MYSQL_USER: ${DB_USERNAME:-dienmay365}
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-local-secret}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 180s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
  redis-data:
  media-data:
