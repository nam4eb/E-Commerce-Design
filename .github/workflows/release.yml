name: Release images

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: app
            image: app
          - target: web
            image: web
          - target: ssr
            image: ssr
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: artifacts/laravel-backend
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/${{ github.repository }}/dienmay365-${{ matrix.image }}:${{ github.ref_name }}
          provenance: mode=max
          sbom: true

  approval-boundary:
    needs: images
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - run: echo "Immutable images are ready. Deployment is intentionally delegated to the protected staging environment."
