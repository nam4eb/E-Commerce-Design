  "components":
    {
      "schemas":
        {
          "HealthStatus":
            {
              "type": "object",
              "properties": { "status": { "type": "string" } },
              "required": ["status"],
            },
          "Error":
            {
              "type": "object",
              "properties": { "message": { "type": "string" } },
              "required": ["message"],
            },
          "Ok":
            {
              "type": "object",
              "properties": { "ok": { "type": "boolean" } },
              "required": ["ok"],
            },
          "Product":
            {
              "type": "object",
              "properties":
                {
                  "id": { "type": "string" },
                  "name": { "type": "string" },
                  "brand": { "type": "string" },
                  "category": { "type": "string" },
                  "categoryId": { "type": "string" },
                  "price": { "type": "integer" },
                  "oldPrice": { "type": "integer" },
                  "rating": { "type": "number" },
                  "reviews": { "type": "integer" },
                  "discount": { "type": "integer" },
                  "image": { "type": "string" },
                  "gallery": { "type": "array", "items": { "type": "string" } },
                  "stock": { "type": "integer" },
                  "sold": { "type": "integer" },
                  "specs":
                    {
                      "type": "array",
                      "items":
                        {
                          "type": "object",
                          "properties":
                            {
                              "label": { "type": "string" },
                              "value": { "type": "string" },
                            },
                          "required": ["label", "value"],
                        },
                    },
                  "tags": { "type": "array", "items": { "type": "string" } },
                },
              "required":
                [
                  "id",
                  "name",
                  "brand",
                  "category",
                  "categoryId",
                  "price",
                  "oldPrice",
                  "rating",
                  "reviews",
                  "discount",
                  "image",
                  "gallery",
                  "stock",
                  "sold",
                  "specs",
                  "tags",
                ],
            },
          "User":
            {
              "type": "object",
              "properties":
                {
                  "id": { "type": "string" },
                  "email": { "type": "string" },
                  "name": { "type": "string" },
                  "phone": { "type": "string" },
                  "address": { "type": "string" },
                  "role": { "enum": ["customer", "admin"], "type": "string" },
                  "wishlist":
                    { "type": "array", "items": { "type": "string" } },
                },
              "required":
                ["id", "email", "name", "phone", "address", "role", "wishlist"],
            },
          "Login":
            {
              "type": "object",
              "properties":
                {
                  "email": { "type": "string", "format": "email" },
                  "password":
                    { "type": "string", "minLength": 10, "maxLength": 128 },
                },
              "required": ["email", "password"],
            },
          "Register":
            {
              "type": "object",
              "properties":
                {
                  "name": { "type": "string", "minLength": 2 },
                  "email": { "type": "string", "format": "email" },
                  "password":
                    { "type": "string", "minLength": 10, "maxLength": 128 },
                },
              "required": ["name", "email", "password"],
            },
          "Profile":
            {
              "type": "object",
              "properties":
                {
                  "name": { "type": "string" },
                  "phone": { "type": "string" },
                  "address": { "type": "string" },
                },
              "required": ["name", "phone", "address"],
            },
          "Wishlist":
            {
              "type": "object",
              "properties":
                { "ids": { "type": "array", "items": { "type": "string" } } },
              "required": ["ids"],
            },
          "Recipient":
            {
              "type": "object",
              "properties":
                {
                  "name": { "type": "string" },
                  "phone": { "type": "string" },
                  "address": { "type": "string" },
                  "city": { "type": "string" },
                  "note": { "type": "string" },
                },
              "required": ["name", "phone", "address", "city"],
            },
          "OrderInput":
            {
              "type": "object",
              "properties":
                {
                  "recipient": { "$ref": "#/components/schemas/Recipient" },
                  "items":
                    {
                      "type": "array",
                      "items":
                        {
                          "type": "object",
                          "properties":
                            {
                              "id": { "type": "string" },
                              "qty":
                                {
                                  "type": "integer",
                                  "minimum": 1,
                                  "maximum": 100,
                                },
                            },
                          "required": ["id", "qty"],
                        },
                    },
                  "method":
                    { "type": "string", "enum": ["cod", "vnpay", "momo"] },
                  "install": { "type": "boolean" },
                  "expectedSubtotal": { "type": "integer" },
                },
              "required": ["recipient", "items", "method", "install"],
            },
          "Order":
            {
              "type": "object",
              "properties":
                {
                  "id": { "type": "string" },
                  "createdAt": { "type": "string", "format": "date-time" },
                  "recipient": { "$ref": "#/components/schemas/Recipient" },
                  "items":
                    {
                      "type": "array",
                      "items":
                        {
                          "type": "object",
                          "properties":
                            {
                              "id": { "type": "string" },
                              "name": { "type": "string" },
                              "price": { "type": "integer" },
                              "qty": { "type": "integer" },
                            },
                          "required": ["id", "name", "price", "qty"],
                        },
                    },
                  "subtotal": { "type": "integer" },
                  "shipping": { "type": "integer" },
                  "installation": { "type": "integer" },
                  "total": { "type": "integer" },
                  "method":
                    { "type": "string", "enum": ["cod", "vnpay", "momo"] },
                  "paymentStatus": { "type": "string" },
                  "status": { "type": "string" },
                },
              "required":
                [
                  "id",
                  "createdAt",
                  "recipient",
                  "items",
                  "subtotal",
                  "shipping",
                  "installation",
                  "total",
                  "method",
                  "paymentStatus",
                  "status",
                ],
            },
          "OrderStatusUpdate":
            {
              "type": "object",
              "properties":
                {
                  "status":
                    {
                      "type": "string",
                      "enum": ["Đã xác nhận", "Đang giao", "Đã giao", "Đã hủy"],
                    },
                },
              "required": ["status"],
            },
          "InventoryUpdate":
            {
              "type": "object",
              "properties":
                {
                  "price":
                    { "type": "integer", "minimum": 1, "maximum": 1000000000 },
                  "stock":
                    { "type": "integer", "minimum": 0, "maximum": 1000000 },
                },
              "required": ["price", "stock"],
            },
          "Url":
            {
              "type": "object",
              "required": ["url"],
              "properties": { "url": { "type": "string", "format": "uri" } },
            },
          "Message":
            {
              "type": "object",
              "required": ["message"],
              "properties": { "message": { "type": "string" } },
            },
          "Content":
            {
              "type": "object",
              "required": ["id", "title", "body"],
              "properties":
                {
                  "id": { "type": "string" },
                  "title": { "type": "string" },
                  "body": { "type": "string" },
                  "image": { "type": "string" },
                  "categoryId": { "type": "string" },
                  "endsAt": { "type": "string" },
                  "productIds":
                    { "type": "array", "items": { "type": "string" } },
                },
            },
          "Review":
            {
              "type": "object",
              "required": ["rating", "body"],
              "properties":
                {
                  "rating": { "type": "integer", "minimum": 1, "maximum": 5 },
                  "body": { "type": "string", "minLength": 10 },
                  "name": { "type": "string" },
                  "created_at": { "type": "string" },
                },
            },
          "StartSocialLoginInput":
            {
              "type": "object",
              "properties": { "link": { "type": "boolean" } },
            },
          "CreatePaymentInput":
            { "type": "object", "additionalProperties": true },
          "CheckPaymentInput":
            { "type": "object", "additionalProperties": true },
          "CancelOrderInput":
            { "type": "object", "additionalProperties": true },
          "MomoIpnInput": { "type": "object", "additionalProperties": true },
          "CollectCodInput": { "type": "object", "additionalProperties": true },
          "SubscribeNewsletterInput":
            {
              "type": "object",
              "required": ["email", "consent"],
              "properties":
                {
                  "email": { "type": "string", "format": "email" },
                  "consent": { "type": "boolean", "const": true },
                },
            },
          "CreateSupportInput":
            {
              "type": "object",
              "required": ["subject", "body"],
              "properties":
                {
                  "subject": { "type": "string" },
                  "body": { "type": "string" },
                },
            },
          "ReplySupportInput":
            {
              "type": "object",
              "required": ["reply"],
              "properties": { "reply": { "type": "string" } },
            },
          "CreateProductInput":
            { "type": "object", "additionalProperties": true },
        },
      "securitySchemes":
        {
          "cookieAuth":
            { "type": "apiKey", "in": "cookie", "name": "shop_session" },
        },
    },
}
